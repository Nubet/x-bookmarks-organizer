name: Release extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $VERSION"
              exit 1
            fi

            VERSION="$VERSION" node -e '
              const fs = require("node:fs");
              const version = process.env.VERSION;
              for (const file of ["package.json", "src/manifest.json"]) {
                const json = JSON.parse(fs.readFileSync(file, "utf8"));
                json.version = version;
                fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
              }
            '

            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="$TAG_NAME"
            VERSION="${RELEASE_TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $RELEASE_TAG"
              exit 1
            fi

            VERSION="$VERSION" node -e '
              const fs = require("node:fs");
              const expected = process.env.VERSION;
              for (const file of ["package.json", "src/manifest.json"]) {
                const actual = JSON.parse(fs.readFileSync(file, "utf8")).version;
                if (actual !== expected) {
                  console.error(file + " has version " + actual + "; expected " + expected);
                  process.exit(1);
                }
              }
            '
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build browser packages
        run: |
          set -eu
          npm run build:page
          for browser in chrome edge firefox; do
            npx extension build \
              --browser "$browser" \
              --zip \
              --zip-filename "x-bookmarks-organizer-${RELEASE_TAG}-${browser}.zip" \
              --silent
          done

      - name: Commit version and create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push origin HEAD:main
          fi
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/chrome/*.zip
          dist/edge/*.zip
          dist/firefox/*.zip
          --repo "${GITHUB_REPOSITORY}"
          --title "$RELEASE_TAG"
          --generate-notes
          --verify-tag
